<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>訪客名單匯出</title>
  <link rel="icon" href="icons/visitor-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css?v=20261112-4">
  <link rel="stylesheet" href="visitor.css?v=20261117-3">
</head>
<body>
  <header class="site-header">
    <h1>訪客名單匯出 <span class="en">Export Visitors</span></h1>
    <p>集中所有手機登錄的展覽訪客，下載成一個 Excel 檔。</p>
  </header>

  <main>
    <section class="card" id="login-card" aria-labelledby="login-title" hidden>
      <h2 id="login-title">登入</h2>
      <p class="note">名單含訪客個資，只有已授權的帳號能下載。</p>
      <form id="login-form" novalidate>
        <label for="email">帳號（Email）</label>
        <input id="email" name="email" type="email" autocomplete="username" required>
        <label for="password">密碼</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button id="login-btn" type="submit" class="primary-btn">登入</button>
        <p id="login-message" class="message" role="status" aria-live="polite" hidden></p>
      </form>
    </section>

    <section class="card" id="export-card" aria-labelledby="export-title" hidden>
      <div class="user-line">
        <span id="user-email"></span>
        <button id="logout-btn" type="button" class="secondary">登出</button>
      </div>
      <h2 id="export-title" style="margin-top:12px">下載 Excel</h2>
      <p class="note">日期留白代表全部。可用日期挑出某一場展覽的訪客。</p>
      <div class="admin-row">
        <div>
          <label for="date-from">登錄日期：從</label>
          <input id="date-from" type="date">
        </div>
        <div>
          <label for="date-to">到</label>
          <input id="date-to" type="date">
        </div>
      </div>
      <button id="download-btn" type="button" class="primary-btn">下載 Excel</button>
      <p id="export-message" class="message" role="status" aria-live="polite" hidden></p>

      <h2 style="margin-top:20px">最新 10 筆預覽</h2>
      <div class="table-wrap">
        <table class="preview">
          <thead id="preview-head"></thead>
          <tbody id="preview-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="config.js?v=20261112-4"></script>
  <script src="visitor-admin.js?v=20261117-1"></script>
</body>
</html>
